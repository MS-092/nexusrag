name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q --ignore=tests/eval
      - name: Retrieval eval (recall@4, citation correctness, refusal)
        run: uv run pytest tests/eval -q -s

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: oven-sh/setup-bun@v2
      - run: uv sync
        working-directory: api
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bunx playwright install --with-deps chromium
        working-directory: web
      - name: Smoke test (set key, upload, ask, open a citation, key only in browser storage)
        run: bun run e2e
        working-directory: web
