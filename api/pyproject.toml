[project]
name = "nexusrag-api"
version = "0.1.0"
description = "NexusRAG local-first second brain API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.12",
  "fastembed>=0.9.1",
  "qdrant-client>=1.20.0",
  "pymupdf>=2.1",
  "openpyxl>=3.1.5",
  "httpx>=0.28.1",
  "rapidocr-onnxruntime>=1.4.4",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["nexusrag"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
