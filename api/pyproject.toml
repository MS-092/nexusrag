[project]
name = "nexusrag-api"
version = "0.1.0"
description = "NexusRAG local-first second brain API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["nexusrag"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
